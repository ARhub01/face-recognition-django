project:
  name: Face Recognition Django System
  version: 1.1

paths:
  raw_data: data/lfw
  processed_data: data/processed
  uploads: data/uploads
  models: models/
  logs: logs/
  embeddings: data/processed/processed_embeddings.npz
  faiss_index: models/faiss.index
  faiss_labels: models/faiss_labels.pkl

face_detection:
  method: mtcnn
  haarcascade_path: models/haarcascade_frontalface_default.xml
  image_size: 224

model:
  backbone: ArcFace
  embedding_dim: 512
  weights: pretrained
  trainable: false

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.0001
  validation_split: 0.2

recognition:
  similarity: cosine
  threshold: 0.5

emotion:
  enabled: true
  model: arpanghoshal/Emo0.1
