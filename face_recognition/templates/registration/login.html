{% extends "base.html" %}

{% block title %}Login | Face Recognition v1.1{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label>
            Username
            {{ form.username }}
        </label>
        <label>
            Password
            {{ form.password }}
        </label>
        <button class="primary-action" type="submit">Login</button>
    </form>
    <p>Need an account? <a href="{% url 'register' %}">Register</a></p>
</section>
{% endblock %}
