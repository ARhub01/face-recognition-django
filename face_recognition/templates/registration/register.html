{% extends "base.html" %}

{% block title %}Register | Face Recognition v1.1{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">New account</p>
    <h1>Register</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="primary-action" type="submit">Create Account</button>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Login</a></p>
</section>
{% endblock %}
