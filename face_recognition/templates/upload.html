{% extends "base.html" %}
{% block content %}
<h2>Upload Image</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload</button>
</form>

{% if processed_image_url %}
    <h3>Recognition Result:</h3>
    <img src="{{ processed_image_url }}" alt="Processed Image" style="width:400px; height:auto; margin-top:10px;">
{% endif %}

<p><a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
{% endblock %}
